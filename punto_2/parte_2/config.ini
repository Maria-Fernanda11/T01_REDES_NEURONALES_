; ============================================================================
; config.ini — Parámetros del punto 2 (TSP con costos, ACO y GA)
; ============================================================================
; Edita los valores y ejecuta:   python3 src/tsp_espana.py
; No hace falta tocar el código.
;
; Reglas del formato:
;   - Una línea por parámetro:  nombre = valor
;   - Lo que va después de ";" es un comentario y se ignora.
;   - Decimales con punto (0.5).
;   - Sí/no:  si | no
;   - Si borras una línea, se usa el valor por defecto indicado entre corchetes.
;
; Prioridad:  opciones de terminal (--seed, --scenario...)  >  este archivo  >  por defecto
; ============================================================================
 
[general]
escenario = both            ; [both]  2016 | 2026 | both
algoritmo = both            ; [both]  aco | ga | both
semilla = 20261008          ; [20261008]  Misma semilla => mismo resultado.
inicio = Madrid             ; [Madrid]  Ciudad desde la que se MUESTRA el recorrido
                            ;           (el ciclo y su costo no cambian).
generar_gif = si            ; [si]  no = más rápido (los GIF tardan unos segundos cada uno)
 
; ----------------------------------------------------------------------------
[costos]
; costo de un tramo = valor_hora × (km / velocidad) + km × consumo/100 × precio + peaje
valor_hora_2016 = 19.77             ; [19.77]  €/h
valor_hora_2026 = 26.18             ; [26.18]  €/h
precio_combustible_2016 = 1.17      ; [1.17]   €/L
precio_combustible_2026 = 1.799     ; [1.799]  €/L
velocidad_kmh = 80                  ; [80]     supuesto: velocidad constante
consumo_l_100km = 4.7               ; [4.7]    Toyota Corolla (fuente en data/parametros.json)
 
; ----------------------------------------------------------------------------
[aco]
; Colonia de hormigas (Ant System)
n_hormigas = 25             ; [25]   Hormigas por iteración. Más = más exploración, más lento.
iteraciones = 80            ; [80]   Ciclos de construcción + actualización de feromona.
alpha = 1.0                 ; [1.0]  Peso de la feromona (memoria colectiva).
beta = 3.0                  ; [3.0]  Peso del costo del tramo (1/c). Alto = más voraz.
rho = 0.5                   ; [0.5]  Evaporación (0 < rho <= 1). Alto = olvida rápido.
 
; ----------------------------------------------------------------------------
[ga]
; Algoritmo genético
tam_poblacion = 60          ; [60]   Número de rutas en la población.
generaciones = 150          ; [150]  Número de generaciones.
p_mutacion = 0.2            ; [0.2]  Probabilidad de mutación por inversión (0 a 1).
k_torneo = 3                ; [3]    Tamaño del torneo. Alto = más presión selectiva.
 