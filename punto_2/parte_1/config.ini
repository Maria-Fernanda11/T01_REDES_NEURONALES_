; ============================================================================
; config.ini — Hiperparámetros del TSP de las 47 capitales (ACO y GA)
; ============================================================================
; Edita los valores y ejecuta:   python tsp_bio.py
; No hace falta tocar tsp_bio.py.
;
; Reglas del formato:
;   - Una línea por parámetro:  nombre = valor
;   - Lo que va después de ";" es un comentario y se ignora.
;   - Decimales con punto (0.1), no con coma.
;   - Sí/no:  si | no   (también vale true | false)
;   - Si borras una línea, se usa el valor por defecto indicado entre corchetes.
;
; Prioridad:  opciones de terminal (--seed, --modo...)  >  este archivo  >  valores por defecto
; ============================================================================

[general]
semilla = 42                ; [42]  Misma semilla => mismo resultado.
inicio = Madrid             ; [Madrid]  Ciudad desde la que se muestra el recorrido.
modo = hibrido              ; [hibrido]  hibrido = con búsqueda local (2-opt + Or-opt)
                            ;            puro    = ACO y GA clásicos (aplica la sección [puro])
distancias = carretera      ; [carretera]  carretera = distancias_km.csv (por carretera, con sentido)
                            ;              haversine = línea recta desde coordenadas.csv
simetrizar = no             ; [no]  no = respeta que ida y vuelta midan distinto (recomendado)
                            ;       si = usa la media de ida y vuelta (para comparar)

; Óptimos exactos (calculados con optimo_exacto.py). Solo miden la diferencia con
; el óptimo; no intervienen en la búsqueda. "ninguno" si no se conoce.
optimo_carretera_km = 6207.7               ; [ninguno]  carretera, con sentido
optimo_carretera_simetrizada_km = 6240.0   ; [ninguno]  carretera, media ida/vuelta
optimo_haversine_km = 4795.8               ; [ninguno]  línea recta
lineas_progreso = 6         ; [6]  Cuántas líneas de progreso imprime cada algoritmo (0 = ninguna).
archivo_csv = resultados.csv
archivo_png = resultados.png

; ----------------------------------------------------------------------------
[aco]
; Colonia de hormigas (Ant System elitista)
n_hormigas = 20             ; [20]   Hormigas por iteración. Más = más exploración, más lento.
iteraciones = 300           ; [300]  Ciclos de construcción + actualización de feromona.
alpha = 1.0                 ; [1.0]  Peso de la feromona (memoria colectiva).
beta = 5.0                  ; [5.0]  Peso de la distancia (1/d). Alto = más voraz.
rho = 0.1                   ; [0.1]  Evaporación (0 < rho <= 1). Alto = olvida rápido.
elitismo = 5.0              ; [5.0]  Refuerzo extra de la mejor ruta global (0 = sin elitismo).
busqueda_local = si         ; [si]   Aplicar 2-opt + Or-opt a la mejor hormiga de cada iteración.

; ----------------------------------------------------------------------------
[ga]
; Algoritmo genético (memético si p_busqueda_local > 0)
tam_poblacion = 150         ; [150]  Número de rutas en la población.
generaciones = 200          ; [200]  Número de generaciones.
p_cruce = 0.9               ; [0.9]  Probabilidad de cruce OX (0 a 1).
p_mutacion = 0.3            ; [0.3]  Probabilidad de mutación por inversión (0 a 1).
p_busqueda_local = 0.05     ; [0.05] Fracción de hijos pulidos con 2-opt + Or-opt (0 = GA clásico).
n_elite = 2                 ; [2]    Mejores rutas que pasan intactas a la siguiente generación.
k_torneo = 3                ; [3]    Tamaño del torneo. Alto = más presión selectiva.

; ----------------------------------------------------------------------------
[puro]
; Solo se aplica con  modo = puro  (o  --modo puro).
; Sustituye los valores de [aco] y [ga] indicados. Formato:  algoritmo.parametro = valor
aco.n_hormigas = 47
aco.iteraciones = 300
aco.busqueda_local = no
ga.generaciones = 1500
ga.p_busqueda_local = 0.0
