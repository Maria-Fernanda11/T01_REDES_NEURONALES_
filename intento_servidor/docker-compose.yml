services:
  ors-app:
    container_name: ors-app
    image: openrouteservice/openrouteservice:v8.1.1
    restart: unless-stopped
    ports:
      - "8080:8082"
    volumes:
      - ./ors-files:/home/ors/files      # aquí va spain-latest.osm.pbf
      - ./ors-logs:/home/ors/logs
      - ors-graphs:/home/ors/graphs
    environment:
      - ORS_ENGINE_SOURCE_FILE=/home/ors/files/spain-latest.osm.pbf
      - ORS_ENGINE_PROFILES_CAR_ENABLED=true
      - XMS=2g
      - XMX=8g
      - REBUILD_GRAPHS=false   # ponlo en true solo si cambias el .pbf
      - ORS_ENGINE_PROFILES_CAR_MAXIMUM_DISTANCE=2000000

volumes:
  ors-graphs:
